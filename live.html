<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>buckets · live</title>
<style>
:root{
  --bg:#04060c; --ink:#dfe8f5; --dim:#7f8ca3; --line:rgba(150,180,255,.14);
  --panel:rgba(8,12,22,.62); --mac:#4fd1ff; --win:#ff8a4c; --claude:#c77dff; --tools:#aab8c8;
  --ok:#4ade80; --bad:#ff5a6b; --step:#5b7cff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dim{color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* header */
#top{position:fixed;left:14px;top:14px;width:min(470px,calc(100vw - 28px));padding:12px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.04em;font-size:15px}
.logo{width:12px;height:12px;border-radius:50%;background:var(--step);box-shadow:0 0 12px var(--step);transition:background .6s,box-shadow .6s}
.badge{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.badge.live{color:var(--ok);border-color:rgba(74,222,128,.4)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;animation:blink 1.2s infinite}
.badge.demo{color:#ffd166;border-color:rgba(255,209,102,.4)}
.badge.replay{color:var(--mac);border-color:rgba(79,209,255,.4)}
@keyframes blink{50%{opacity:.25}}
#runLine{margin-top:4px;font-size:11px}
#request{margin-top:6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#stepper{display:flex;gap:6px;margin-top:10px;align-items:center}
.sdot{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);transition:background .4s,box-shadow .4s}
.sdot.past{background:rgba(255,255,255,.38)}
.sdot.cur{background:var(--step);box-shadow:0 0 10px var(--step)}
#stepName{margin-top:6px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
#stepName b{color:var(--step);font-weight:600}
#elapsed{font-variant-numeric:tabular-nums}
.round{display:inline-block;margin-left:6px;padding:0 6px;border-radius:99px;background:rgba(255,180,84,.18);color:#ffb454;font-size:11px}

/* machine cards */
#cards{position:fixed;right:14px;top:14px;width:250px;display:flex;flex-direction:column;gap:8px}
.card{padding:9px 11px;border-left:3px solid var(--c);position:relative}
.card h4{margin:0;font-size:13px;display:flex;gap:6px;align-items:baseline}
.card h4 i{font-style:normal;color:var(--dim);font-weight:400;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .row{display:flex;justify-content:space-between;margin-top:3px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.card .row span{white-space:nowrap}
.card .row b{color:var(--ink);font-weight:600}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .4s}
.card .live{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.15}
.card.on .live{opacity:1;box-shadow:0 0 10px var(--c);animation:blink .9s infinite}

/* log */
#log{position:fixed;left:14px;bottom:calc(var(--ctl,56px) + 22px);width:min(470px,calc(100vw - 28px));padding:8px 12px;font-size:12px}
#log div{white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);padding:1px 0;animation:in .4s}
#log div.step{color:var(--step);font-weight:600;margin-top:3px}
#log div.ok{color:#9be7b5}
#log div.bad{color:var(--bad)}
#log div:last-child{color:var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(5px)}}

/* big overlays */
#stepTitle{position:fixed;left:0;right:0;top:19%;text-align:center;pointer-events:none;opacity:0}
#stepTitle small{display:block;letter-spacing:.35em;font-size:12px;text-transform:uppercase;color:var(--step);margin-bottom:6px}
#stepTitle span{font-size:clamp(22px,4.4vw,48px);font-weight:300;letter-spacing:.02em;text-shadow:0 0 30px var(--step)}
#stepTitle.show{animation:title 3.2s ease-out}
@keyframes title{0%{opacity:0;transform:translateY(14px) scale(.97);filter:blur(6px)}14%{opacity:1;transform:none;filter:none}72%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#result{position:fixed;left:50%;top:40%;z-index:2;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
  text-align:center;padding:14px 28px;transition:opacity .6s,transform .6s}
#result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#result b{display:block;font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--rc)}
#result span{color:var(--dim);font-size:12px}
#idle{position:fixed;left:0;right:0;top:46%;text-align:center;color:var(--dim);letter-spacing:.2em;font-size:12px;text-transform:uppercase;pointer-events:none;transition:opacity .5s}

/* neuron labels (CSS2D) */
.nlabel{text-align:center;font-size:12px;white-space:nowrap;text-shadow:0 0 8px #000,0 0 2px #000}
.nlabel b{color:var(--c);letter-spacing:.06em;font-size:13px}
.nlabel i{display:block;font-style:normal;font-size:10px;color:var(--dim)}
.chips{display:flex;gap:4px;justify-content:center;min-height:16px;margin-top:2px}
.chips u{text-decoration:none;font-size:10px;padding:1px 6px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid var(--c);color:var(--c)}
.slabel{font-size:10px;padding:0 5px;border-radius:99px;background:rgba(0,0,0,.5);color:var(--c);white-space:nowrap}
.corelabel{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#cfe0ff;opacity:.8;text-shadow:0 0 8px #000}

/* controls */
#controls{position:fixed;left:14px;right:14px;bottom:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#controls .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
button,select{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:0;padding:6px 10px;cursor:pointer}
select{border:1px solid var(--line);border-radius:8px;max-width:260px}
select option{background:#0b1020}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:rgba(120,160,255,.28);color:#fff}
#controls .seg button+button{border-left:1px solid var(--line)}
#scrub{flex:1;min-width:120px;accent-color:var(--step)}
#clock{font-variant-numeric:tabular-nums;color:var(--dim);min-width:84px;text-align:right}
#legend{display:flex;gap:10px;font-size:11px;color:var(--dim);margin-left:auto}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-0.5px}
body[data-mode=live] .replay-only,body[data-mode=live] #scrub,body[data-mode=live] #clock{display:none!important}
body[data-mode=demo] #picker{display:none!important}
#hudToggle{position:fixed;right:14px;bottom:calc(var(--ctl,56px) + 22px);padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
#tip{position:fixed;z-index:9;pointer-events:none;display:none;padding:7px 10px;border-radius:8px;font-size:12px;
  background:rgba(6,9,18,.92);border:1px solid var(--line);max-width:260px;line-height:1.45}
#tip b{color:var(--c)}
body.hud-min #log,body.hud-min #cards,body.hud-min #request{display:none}

@media (max-width:760px){
  #top{padding:9px 11px;top:8px;left:8px;width:calc(100vw - 16px)}
  #request{-webkit-line-clamp:2;font-size:12px}
  #cards{left:8px;right:8px;top:auto;bottom:calc(var(--ctl,56px) + 16px);width:auto;flex-direction:row;gap:5px}
  .card{flex:1;min-width:0;padding:6px 7px}
  .card h4 i,.card .row.hide-sm,.card .nowtxt{display:none}
  .card .row{font-size:10.5px}
  #log{left:8px;bottom:calc(var(--ctl,56px) + 78px);width:calc(100vw - 16px);font-size:11px}
  #log div:nth-last-child(n+6){display:none}
  #controls{left:8px;right:8px;bottom:8px;gap:6px}
  #legend{display:none}
  #hudToggle{bottom:auto;top:8px;right:8px;z-index:3;padding:3px 8px}
  .badge{margin-right:34px}
  .slabel{display:none}
  body.hud-min #cards{display:flex}
  #result{top:45%}
  #stepTitle{top:24%}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body data-mode="demo">
<div id="stage"></div>
<div id="labels"></div>
<div id="fade"></div>

<section id="top" class="panel">
  <div class="brand"><span class="logo"></span>buckets <span id="modeBadge" class="badge">demo</span></div>
  <div id="runLine" class="dim mono">waiting for a run…</div>
  <div id="request"></div>
  <div id="stepper"></div>
  <div id="stepName"><span id="stepText" class="dim">—</span><span id="elapsed" class="mono">00:00</span></div>
</section>
<aside id="cards"></aside>
<section id="log" class="panel"></section>
<div id="stepTitle"><small></small><span></span></div>
<div id="idle">waiting for a buckets run…</div>
<div id="result" class="panel"><b></b><span></span></div>
<button id="hudToggle" title="Toggle HUD (H)">HUD</button>
<div id="tip"></div>

<footer id="controls" class="panel">
  <div class="seg" id="modeSeg"><button data-m="live">LIVE</button><button data-m="replay">REPLAY</button></div>
  <select id="picker" class="replay-only" aria-label="run"></select>
  <button id="play" class="replay-only" title="Play / pause (space)">⏸</button>
  <div class="seg replay-only" id="speeds"></div>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="position">
  <span id="clock" class="mono"></span>
  <div id="legend"><span><i style="background:#8fa0ff"></i>thinking</span><span><i style="background:#4fd1ff"></i>answer</span><span><i style="background:#fff"></i>prompt in</span><span><i style="background:#4ade80"></i>pass</span><span><i style="background:#ff5a6b"></i>fail</span></div>
</footer>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

/* ───────────────────────── config ───────────────────────── */
const MACHINES = {
  mac:     {name:'Mac',     sub:'Qwen3.6-35B · Ollama',        color:0x4fd1ff, css:'#4fd1ff', pos:[-9.5, 1.0,-2.0], r:1.75, tps:40},
  windows: {name:'Windows', sub:'Qwen3.6-35B · llama.cpp',     color:0xff8a4c, css:'#ff8a4c', pos:[ 9.5, 1.0,-2.0], r:1.75, tps:60},
  claude:  {name:'Claude',  sub:'paid fallback',               color:0xc77dff, css:'#c77dff', pos:[ 0.0, 7.4,-6.5], r:1.0,  tps:60},
  tools:   {name:'Tools',   sub:'tsc · eslint · jest · ts_moves · git', color:0xaab8c8, css:'#aab8c8', pos:[0.0,-6.6, 1.5], r:1.15, tps:0},
};
const STEP_COLORS = [0x5b7cff, 0x5b7cff, 0x20c9b0, 0xa06bff, 0xf5c242, 0xff6b9a];
const RESULT_COLORS = {true:0x4ade80, false:0xff5a6b, null:0x5ab0ff};
const THINK_TINT = new THREE.Color(0x7a6cff);
const GREEN = new THREE.Color(0x4ade80), RED = new THREE.Color(0xff5a6b), WHITE = new THREE.Color(0xffffff), GOLD = new THREE.Color(0xffd166);
const MAX_PARTICLES = 4000, MAX_MOTES = 400, IDLE_SECS = 3, EST_TPS_FALLBACK = 40;
const SPEEDS = [1, 5, 10, 20, 60];

/* ───────────────────────── helpers ───────────────────────── */
const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(0) + 'k' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n));
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function rng(seed) { let a = seed * 2654435761 >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ───────────────────────── renderer / scene ───────────────────────── */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: 'high-performance'});
const PR = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({element: $('#labels')});

const scene = new THREE.Scene();
const BG = new THREE.Color(0x04060c);
scene.background = BG.clone();
scene.fog = new THREE.FogExp2(0x04060c, 0.012);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 400);
camera.position.set(0, 4.5, 24);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 8; controls.maxDistance = 95;
controls.target.set(0, 0.4, -1);
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
let userTouchedCamera = false, idleTimer = 0;
controls.addEventListener('start', () => { userTouchedCamera = true; controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => { idleTimer = setTimeout(() => controls.autoRotate = true, 9000); });

const composer = new EffectComposer(renderer);
composer.setPixelRatio(PR);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 1.0, 0.6, 0.3);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const pointScale = {value: 800};
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  document.documentElement.style.setProperty('--ctl', $('#controls').offsetHeight + 'px');
  fitCamera(w, h);
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  pointScale.value = h * PR / (2 * tanHalf);
  bloom.strength = w < 760 ? 0.8 : 1.0;
}
// frame the scene in the free band between the HUD panels (matters on phones)
function fitCamera(w, h) {
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), narrow = w < 760;
  let top = 0, bot = h;
  if (narrow) { top = $('#top').getBoundingClientRect().bottom + 4; bot = $('#cards').getBoundingClientRect().top - 10; }
  const band = Math.max(160, bot - top);
  if (!userTouchedCamera) {
    const fitH = 22 * h / (band * 2 * tanHalf), fitW = 25 / (w / h * 2 * tanHalf);
    camera.position.setLength(clamp(Math.max(25.5, fitH, fitW), 25.5, 90));
  }
  if (narrow) camera.setViewOffset(w, h, 0, -((top + bot) / 2 - h / 2), w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ───────────────────────── shaders ───────────────────────── */
const BODY_VS = `varying vec3 vN,vV,vP; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vV=normalize(-mv.xyz); vP=position; gl_Position=projectionMatrix*mv; }`;
const BODY_FS = `uniform vec3 uColor,uThinkColor; uniform float uThink,uEnergy,uTime; varying vec3 vN,vV,vP;
void main(){
  float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.);
  float sp=mix(1.,2.4,uThink);
  float p=.5+.5*sin(vP.x*2.6+uTime*1.3*sp)*sin(vP.y*3.1-uTime*1.1*sp)*sin(vP.z*2.8+uTime*.9*sp);
  vec3 c=mix(uColor,uThinkColor,uThink*.7);
  gl_FragColor=vec4(c*(.12+.5*f+.45*p*uEnergy)*(.5+uEnergy*.7),1.);
}`;
const GLOW_FS = `uniform vec3 uColor; uniform float uI; varying vec3 vN,vV,vP;
void main(){ float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.6); gl_FragColor=vec4(uColor*1.6,f*uI); }`;
const TUBE_VS = `varying float vU; void main(){ vU=uv.x; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const TUBE_FS = `uniform vec3 uColor; uniform float uGrow,uFade,uTime,uSpeed,uDensity,uBase; varying float vU;
void main(){
  if(vU>uGrow) discard;
  float head=smoothstep(uGrow-.14,uGrow,vU)*step(uGrow,.999);
  float pulse=pow(.5+.5*sin((vU*uDensity-uTime*uSpeed)*6.2831),3.);
  float a=(uBase+pulse*1.1+head*1.6)*uFade;
  gl_FragColor=vec4(uColor*1.5,a);
}`;
const PT_VS = `attribute float aSize,aAlpha; attribute vec3 aColor; uniform float uScale; varying vec3 vC; varying float vA;
void main(){ vC=aColor; vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aSize*uScale/-mv.z; gl_Position=projectionMatrix*mv; }`;
const PT_FS = `varying vec3 vC; varying float vA;
void main(){ float r=length(gl_PointCoord-.5)*2.; if(r>1.) discard; float a=pow(1.-r,2.2)*vA; gl_FragColor=vec4(vC,a); }`;

function additive(extra) {
  return new THREE.ShaderMaterial(Object.assign({transparent: true, depthWrite: false, blending: THREE.AdditiveBlending}, extra));
}

/* ───────────────────────── static scene: core, neurons, stars ───────────────────────── */
const coreGroup = new THREE.Group(); scene.add(coreGroup);
const core = (() => {
  const color = new THREE.Color(STEP_COLORS[0]);
  const bodyU = {uColor: {value: color}, uThinkColor: {value: THINK_TINT}, uThink: {value: 0}, uEnergy: {value: .5}, uTime: {value: 0}};
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.15, 48, 32), new THREE.ShaderMaterial({uniforms: bodyU, vertexShader: BODY_VS, fragmentShader: BODY_FS}));
  const glowU = {uColor: {value: color}, uI: {value: 1}};
  const glow = new THREE.Mesh(new THREE.SphereGeometry(1.75, 32, 24), additive({uniforms: glowU, vertexShader: BODY_VS, fragmentShader: GLOW_FS}));
  const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(2.15, 1), new THREE.MeshBasicMaterial({color, wireframe: true, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false}));
  const ico = new THREE.IcosahedronGeometry(2.15, 1);
  const nodes = new THREE.Points(ico, new THREE.PointsMaterial({color: 0xffffff, size: .09, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false}));
  const rings = [2.7, 3.25].map((r, i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, .012, 8, 128), new THREE.MeshBasicMaterial({color, transparent: true, opacity: .45, blending: THREE.AdditiveBlending, depthWrite: false}));
    m.rotation.set(1.1 + i * .6, i * .9, 0); return m;
  });
  coreGroup.add(body, glow, wire, nodes, ...rings);
  const label = new CSS2DObject(el('div', 'corelabel', 'buckets')); label.position.set(0, -3.9, 0); coreGroup.add(label);
  return {color, bodyU, glowU, wire, nodes, rings, kick: 0, spin: 0};
})();
const CORE_POS = new THREE.Vector3(0, 0, 0);

const neurons = {};
for (const [key, m] of Object.entries(MACHINES)) neurons[key] = buildNeuron(key, m);

function buildNeuron(key, m) {
  const color = new THREE.Color(m.color), pos = new THREE.Vector3(...m.pos);
  const group = new THREE.Group(); group.position.copy(pos); scene.add(group);
  const bodyU = {uColor: {value: color}, uThinkColor: {value: THINK_TINT}, uThink: {value: 0}, uEnergy: {value: .3}, uTime: {value: 0}};
  const geo = key === 'tools' ? new THREE.OctahedronGeometry(m.r * 1.25, 0) : new THREE.SphereGeometry(m.r, 48, 32);
  const body = new THREE.Mesh(geo, new THREE.ShaderMaterial({uniforms: bodyU, vertexShader: BODY_VS, fragmentShader: BODY_FS}));
  const glowU = {uColor: {value: color}, uI: {value: .6}};
  const glow = new THREE.Mesh(key === 'tools' ? new THREE.OctahedronGeometry(m.r * 1.8, 0) : new THREE.SphereGeometry(m.r * 1.55, 32, 24),

const stars = (() => {

/* ───────────────────────── particles (shared pool) ───────────────────────── */
const P = (() => {

const tmpV = new THREE.Vector3();

}
// free-flying spark (tools, results, failures)

    const i = nextSlot();
    tmpV.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(speed * (.35 + Math.random() * .65));

/* ───────────────────────── synapses ───────────────────────── */
const synapses = [];   // visible axons (calls and tool runs), including ones that are fading out

function makeSynapse(seed, machine, color, radius, kind) {

  const dir = n.pos.clone().normalize();
  const side = new THREE.Vector3(r() - .5, r() - .5, r() - .5).cross(dir).normalize();
  const a = dir.clone().multiplyScalar(1.15).addScaledVector(side, (r() - .5) * .9);

    vertexShader: TUBE_VS, fragmentShader: TUBE_FS, side: THREE.DoubleSide});

  mesh.frustumCulled = false; scene.add(mesh);
  const domEl = el('div', 'slabel'); domEl.style.setProperty('--c', '#' + new THREE.Color(color).getHexString());
  const lab = new CSS2DObject(domEl); lab.position.copy(curve.getPoint(.5)); scene.add(lab);

}

/* ───────────────────────── motes (short-term memory) ───────────────────────── */
const motes = [];
const M = (() => {

  const g = new THREE.BufferGeometry();
  for (const [name, arr, n] of [['position', o.pos, 3], ['aColor', o.col, 3], ['aSize', o.size, 1], ['aAlpha', o.alpha, 1]]) {
    const b = new THREE.BufferAttribute(arr, n); b.setUsage(THREE.DynamicDrawUsage); g.setAttribute(name, b); o[name] = b;
  }
  g.setDrawRange(0, 0);
  o.points = new THREE.Points(g, additive({uniforms: {uScale: pointScale}, vertexShader: PT_VS, fragmentShader: PT_FS}));
  o.points.frustumCulled = false; scene.add(o.points); o.geo = g; return o;
})();

function addMote(call, realNow) {
  const r = rng(call.id * 31 + 5), n = neurons[call.machine];
  const failed = !call.ok;
  motes.push({
    call, born: realNow, simT: S.now, machine: call.machine, failed,
    color: failed ? RED : new THREE.Color(MACHINES[call.machine].color),

/* ───────────────────────── simulation state ───────────────────────── */
let S, resultTimer = 0;
function freshState() {
  const mach = {};
  for (const k of Object.keys(MACHINES)) mach[k] = {calls: 0, tokIn: 0, tokOut: 0, open: 0, busy: 0, ok: 0, fail: 0};
  return {run: null, repo: '', request: '', t0: null, now: 0, simT: null, step: 0, total: 5, stepName: '', round: 1, seen4: false,
    ended: false, endEv: null, calls: new Map(), tools: new Map(), mach, log: [], fast: false, hudDirty: true};
}
S = freshState();

function resetScene() {
  for (const s of synapses.splice(0)) disposeSynapse(s);
  motes.length = 0; M.geo.setDrawRange(0, 0);
  clearParticles();
  for (const n of Object.values(neurons)) { n.open = 0; n.active.clear(); n.dirty = true; n.thinkTarget = 0; n.kick = 0; }
  core.kick = 0;
  S = freshState();
  applyAmbient(0);
  clearTimeout(resultTimer); $('#result').classList.remove('show');
  $('#idle').style.opacity = 1;
  renderStepper(); renderLog(); S.hudDirty = true;
}

function accrue(toT) {

  const dt = toT - S.simT;
  if (dt <= 0) return;
  for (const m of Object.values(S.mach)) if (m.open > 0) m.busy += dt;
  S.simT = toT;

/* ───────────────────────── event handling ───────────────────────── */
const STEP_RE = /^Step (\d+)\/(\d+) · (.+)$/;

function applyEvent(e, fast) {
  S.fast = fast;
  if (e.t != null && !S.ended) { accrue(e.t); S.now = Math.max(S.now, e.t); }
  switch (e.ev) {
    case 'run': onRun(e); break;
    case 'say': onSay(e); break;
    case 'call': onCall(e); break;
    case 'progress': onProgress(e); break;
    case 'call_end': onCallEnd(e); break;
    case 'tool': onTool(e); break;
    case 'tool_end': onToolEnd(e); break;
    case 'end': onEnd(e); break;
  }
  S.hudDirty = true;
}

function onRun(e) {
  S.run = e.run; S.repo = e.repo; S.request = e.request; S.t0 = e.t; S.simT = e.t; S.now = e.t;
  $('#idle').style.opacity = 0;
}

function onSay(e) {
  const text = e.text || '', m = STEP_RE.exec(text);
  let cls = '';
  if (m) { cls = 'step'; setStep(+m[1], +m[2], m[3]); }
  else if (/✗|failed|error|not done/i.test(text)) cls = 'bad';
  else if (/✓/.test(text)) cls = 'ok';
  pushLog(text, cls);
}

function setStep(n, total, name) {
  if (n === 4 && S.seen4 && S.step === 5) S.round++;
  const r = /round (\d+)/i.exec(name); if (r) S.round = +r[1];
  if (n === 4) S.seen4 = true;
  S.step = n; S.total = total; S.stepName = name;
  renderStepper();
  if (!S.fast) showStepTitle(n, total, name);
}

function onCall(e) {
  const mk = MACHINES[e.machine] ? e.machine : 'windows', mach = S.mach[mk], n = neurons[mk];
  const color = new THREE.Color(MACHINES[mk].color), thinkColor = color.clone().lerp(THINK_TINT, .65);
  const call = {kind: 'call', id: e.id, label: e.label, machine: mk, model: e.model, think: !!e.think, promptTokens: e.prompt_tokens || 0,
    t: e.t, lastProgT: e.t, estT: 0, tokens: 0, actual: 0, thinking: 0, thinkFrac: e.think ? 1 : 0, tps: 0, phase: 'prompt', open: true, ok: true, color, thinkColor, emitAcc: 0, firstProg: false};
  S.calls.set(e.id, call);

  if (e.tokens_in != null) { mach.tokIn += e.tokens_in - c.promptTokens; c.tokensIn = e.tokens_in; } else c.tokensIn = c.promptTokens;
  if (e.tokens_out != null) { mach.tokOut += e.tokens_out - c.tokens; c.tokens = e.tokens_out; }

const TOOL_COLOR = {check: new THREE.Color(0xbfe3ff), move: GOLD};

function onEnd(e) {
  accrue(e.t);

const ambient = {cur: new THREE.Color(0x5b7cff), bg: new THREE.Color(0x04060c)};
function applyAmbient(dt) {
  const target = new THREE.Color(S.stepOverride != null ? S.stepOverride : STEP_COLORS[S.step] ?? STEP_COLORS[0]);
  const k = dt ? 1 - Math.exp(-dt * 1.6) : 1;
  ambient.cur.lerp(target, k);
  const bg = BG.clone().lerp(ambient.cur, .055);
  scene.background.lerp(bg, k); scene.fog.color.copy(scene.background);
  core.color.copy(ambient.cur);
  core.wire.material.color.copy(ambient.cur); core.rings.forEach((r) => r.material.color.copy(ambient.cur));
  stars.material.color.copy(new THREE.Color(0x8aa0d0).lerp(ambient.cur, .45));
  document.documentElement.style.setProperty('--step', '#' + ambient.cur.getHexString());
}

function stepSimulation(dt, realNow) {
  // estimate tokens for open calls that stopped reporting, so nothing looks frozen
  for (const c of S.calls.values()) {
    if (!c.open) continue;
    const idle = S.now - c.lastProgT;
    if (idle > IDLE_SECS && !S.ended) {
      const rate = MACHINES[c.machine].tps || EST_TPS_FALLBACK;
      const from = Math.max(c.estT, c.lastProgT + IDLE_SECS), d = S.now - from;
      if (d > 0) { c.tokens += d * rate; S.mach[c.machine].tokOut += d * rate; c.estT = S.now; }
      c.tps = rate; c.phase = 'stream'; c.est = true;
    }
    if (c.phase === 'stream' && !S.fast) emitStream(c, dt);
  }
  // tool synapses shed small pulses while running
  for (const t of S.tools.values()) if (t.open && Math.random() < dt * 14) emitAlong(t.syn.curve, 1, TOOL_COLOR[t.tkind] || TOOL_COLOR.check, .12);
  if (!S.ended && S.t0 != null) accrue(S.now);
}

function emitStream(c, dt) {
  c.emitAcc += clamp(c.tps * .45, 3, 42) * dt;
  let n = 0;
  while (c.emitAcc >= 1 && n++ < 10) {
    c.emitAcc -= 1;
    const think = Math.random() < c.thinkFrac;
    emitAlong(c.syn.curve, -1, think ? c.thinkColor : c.color, think ? .15 : .19);
  }
  if (c.emitAcc > 10) c.emitAcc = 0;
}

function updateNeurons(dt, time) {
  const open = Object.values(S.mach).reduce((a, m) => a + m.open, 0);
  for (const n of Object.values(neurons)) {
    const target = (n.key === 'claude' ? .14 : .3) + clamp(n.open / 2, 0, 1) * .7;
    n.energy = lerp(n.energy, target, 1 - Math.exp(-dt * 3));
    n.kick *= Math.exp(-dt * 3.5);
    n.think = lerp(n.think, n.thinkTarget, 1 - Math.exp(-dt * 2));
    const u = n.bodyU; u.uTime.value = time; u.uEnergy.value = n.energy + n.kick * .6; u.uThink.value = n.think;
    n.glowU.uI.value = .35 + n.energy * 1.1 + n.kick;
    n.group.scale.setScalar(1 + .035 * Math.sin(time * (1.4 + n.open)) * (.4 + n.energy) + n.kick * .14);
    n.group.rotation.y += dt * (n.key === 'tools' ? .6 : .12);
    if (n.dirty) { n.dirty = false; renderChips(n); }
  }
  // core
  core.kick *= Math.exp(-dt * 3);
  core.bodyU.uTime.value = time;
  core.bodyU.uEnergy.value = .35 + clamp(open / 3, 0, 1) * .6 + core.kick * .8;
  core.glowU.uI.value = .5 + clamp(open / 3, 0, 1) * .6 + core.kick * 1.2;
  coreGroup.scale.setScalar(1 + .035 * Math.sin(time * (1.5 + open * .8)) + core.kick * .12);
  const spin = dt * (.12 + open * .12);
  core.wire.rotation.y += spin; core.nodes.rotation.y += spin; core.wire.rotation.x += spin * .4; core.nodes.rotation.x += spin * .4;
  core.rings[0].rotation.z += spin * 1.6; core.rings[1].rotation.x += spin * 1.2;
}

function buildHud() {
  const cards = $('#cards');
  for (const [k, m] of Object.entries(MACHINES)) {

function renderStepper() {

  [...dots].forEach((d, i) => d.className = 'sdot' + (i + 1 < S.step ? ' past' : i + 1 === S.step ? ' cur' : ''));
  const t = $('#stepText');

  if (S.endEv) {
    const d = S.endEv.done, b = el('b', null, d === true ? '✓ Done' : d === false ? '✗ Not done' : 'Answered');
    b.style.color = '#' + new THREE.Color(RESULT_COLORS[d]).getHexString();
    t.append(b, ' ' + (S.endEv.branch || ''));

    const b = el('b', null, `${S.step}/${S.total}`); t.append(b, ' ' + S.stepName.replace(/\s*\(round \d+\)/i, ''));
    if (S.round > 1) t.append(el('span', 'round', 'round ' + S.round));

let lastHud = 0;

  $('#elapsed').textContent = mmss(elapsed);

let tipClock = 0;
function updateTip(dt) {
  tipClock += dt; if (tipClock < .05) return; tipClock = 0;
  if (!mouse.in) return;
  let best = null, bestD = 14;
  const consider = (item, wx, wy, wz, pad = 0) => {
    tmpV.set(wx, wy, wz).project(camera);
    if (tmpV.z > 1) return;
    const sx = (tmpV.x + 1) / 2 * innerWidth, sy = (1 - tmpV.y) / 2 * innerHeight, d = Math.hypot(sx - mouse.x, sy - mouse.y) - pad;
    if (d < bestD) { bestD = d; best = item; }
  };
  for (const m of motes) consider(m.call, m.p.x, m.p.y, m.p.z, 3);
  const q = new THREE.Vector3();
  for (const s of synapses) {
    if (s.fade < .2) continue;
    for (let i = 1; i < 12; i++) { s.curve.getPoint(i / 12 * s.grow, q); consider(s.owner, q.x, q.y, q.z); }
  }
  if (!best) { tip.style.display = 'none'; return; }
  showTip(best);
}

    html = `<b style="color:${col}">${esc(c.name || c.label)}</b> · tools<br>${esc(c.tkind || '')} · ${open ? 'running' : c.ok ? 'passed' : 'failed'}${c.secs != null ? '<br>' + c.secs + ' s' : ''}`;

    html = `<b style="color:${col}">${esc(c.label)}</b> · ${MACHINES[mk].name}${c.model ? ' <span class="dim">' + esc(c.model) + '</span>' : ''}<br>` +

  driveSource(dt);
  stepSimulation(dt, realNow);
  for (let i = synapses.length - 1; i >= 0; i--) if (!updateSynapse(synapses[i], dt, time)) { disposeSynapse(synapses[i]); synapses.splice(i, 1); }
  updateParticles(dt);
  updateMotes(time, realNow);
  updateNeurons(dt, time);
  applyAmbient(dt);
  stars.rotation.y += dt * .004;
  updateHud(realNow, S.hudDirty); S.hudDirty = false;
  updateTip(dt);
  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
}

async function boot() {
  buildHud(); wireControls(); resize(); renderStepper(); renderLog();
  setMode('demo');
  frame();
  if (location.protocol === 'file:') return startDemo();
  try {
    const j = await getJson('/api/runs', 2500);
    D.apiOk = true; D.runs = j.runs || [];
    startLive();
  } catch { startDemo(); }
}
boot();
</script>
